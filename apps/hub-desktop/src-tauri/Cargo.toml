[package]
name = "maxprice-hub-desktop"
version = "0.10.1"
description = "MaxPrice Hub"
authors = ["Max Schoening"]
license = "MIT"
edition = "2021"

[lib]
name = "maxprice_hub_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-autostart = "2"
tauri-plugin-os = "2"
# The App info card's User guide row opens the guide in the default browser
# (#564); the console's capability scopes it to the guide's URLs. The client
# carries its own copy (ADR-0077).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "macros", "rt", "io-util"] }
parking_lot = "0.12"
time = "0.3"

[dev-dependencies]
tempfile = "3"

# Read-only HKCU access for the autostart self-heal (ADR-0051). The autostart
# plugin can only tell us an entry EXISTS, never where it points, so we read the
# Run value ourselves; `enable()` stays the only writer.
#
# Version 0.55 is already resolved in the lock, but only as a HOST-SIDE
# build-dependency (tauri-build -> tauri-winres -> embed-resource 3.0.9); this
# is the first time it is linked into the shipped exe. auto-launch 0.5.0 (the
# plugin's own backend) links its own older winreg 0.10.1, on the unmaintained
# winapi shim — the duplicate is deliberate, and the two need not stay aligned.
#
# windows-sys carries the job-object calls that give the daemon a kernel-enforced
# lifetime (ADR-0072). 0.61 is already in the lock as a transitive dependency, so
# pinning it here adds no new version to the graph.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# The popout adapter (ADR-0084, ADR-0097), its rounded corners (ADR-0148
# §2) and the menu-bar icon (§3): AppKit rounds a window through public API,
# masking the content view's layer, so this needs no `macos-private-api`. The
# crates are tao/tauri transitives at these versions, taken with `default-features = false` so they
# add no package to the graph (the client's Cargo.toml says why). Add a feature
# when the code needs the class.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "NSBezierPath",
  "NSButton",
  "NSColor",
  "NSControl",
  "NSEvent",
  "NSGraphics",
  "NSGraphicsContext",
  "NSImage",
  "NSResponder",
  "NSScreen",
  "NSRunningApplication",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSWindow",
  "objc2-core-foundation",
  "objc2-quartz-core",
] }
# The menu-bar icon's drawing handler (ADR-0148 §3) and its geometry types.
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSEnumerator",
  "NSGeometry",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "objc2-core-foundation",
] }
